[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "orientia"
version = "0.1.0"
description = "Specialized RAG for French student orientation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "golden: gate CI golden 50q (intégration, nécessite index FAISS + MISTRAL_API_KEY ; skippé sinon)",
    "integration: test d'intégration (ressources externes : index, API, réseau)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
